[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-agent"
version = "0.1.0"
description = "Selective Information Evaluation and Verification for Executable Beliefs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
hf = [
  "torch>=2.7.1",
  "transformers>=4.51.0",
  "peft>=0.16.0",
  "accelerate>=1.8.1",
]

generation = ["zai-sdk>=0.2.3"]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

